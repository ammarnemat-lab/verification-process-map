<title>CBAM Verification Process Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{--paper:#FFFFFF; --ink:#111; --muted:#4F4F4F; --line:#C7C7C7}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--paper:#121212; --ink:#EDEDED; --muted:#A6A6A6; --line:#3D3D3D}
  }
  :root[data-theme="dark"]{--paper:#121212; --ink:#EDEDED; --muted:#A6A6A6; --line:#3D3D3D}
  body{margin:0; background:var(--paper); color:var(--ink);
       font-family:'IBM Plex Sans',system-ui,sans-serif;
       display:flex; align-items:center; justify-content:center; min-height:100vh}
  .card{border:1.5px solid var(--ink); border-radius:6px; padding:38px 42px; max-width:420px; text-align:center}
  h1{font-size:20px; margin:0 0 6px}
  p{color:var(--muted); font-size:13.5px; margin:0 0 22px}
  input{font-family:'IBM Plex Mono',monospace; font-size:15px; padding:9px 12px; width:100%;
        box-sizing:border-box; border:1.5px solid var(--ink); border-radius:4px;
        background:var(--paper); color:var(--ink); text-align:center; letter-spacing:.04em}
  button{margin-top:14px; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14px;
         padding:9px 26px; background:var(--ink); color:var(--paper); border:none; border-radius:4px; cursor:pointer}
  .err{color:#B03030; font-size:12.5px; height:16px; margin-top:10px}
  .lock{font-size:30px; margin-bottom:12px}
</style>
<div class="card">
  <div class="lock">&#128274;</div>
  <h1>CBAM Verification Process Map</h1>
  <p>This document is access-protected. Enter the password you received to open it.</p>
  <input id="pw" type="password" autocomplete="off" autofocus
         onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">Open</button>
  <div class="err" id="err"></div>
</div>

const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const err=document.getElementById('err');
  err.textContent='';
  const pw=document.getElementById('pw').value;
  if(!pw) return;
  try{
    const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b2a(SALT), iterations:ITER, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(IV)}, key, b2a(DATA));
    const html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent='Wrong password.';
    document.getElementById('pw').select();
  }
}
